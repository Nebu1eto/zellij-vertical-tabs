[changelog]
header = """
# Changelog

All notable changes to this project are documented here.

"""
body = """
{% if version %}\
    ## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | upper_first }}
    {% endfor %}
{% endfor %}
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false
commit_parsers = [
  { message = "^(\\[[^]]+\\]\\s+)?feat", group = "Features" },
  { message = "^(\\[[^]]+\\]\\s+)?fix", group = "Bug Fixes" },
  { message = "^(\\[[^]]+\\]\\s+)?docs?", group = "Documentation" },
  { message = "^(\\[[^]]+\\]\\s+)?perf", group = "Performance" },
  { message = "^(\\[[^]]+\\]\\s+)?refactor", group = "Refactoring" },
  { message = "^(\\[[^]]+\\]\\s+)?test", group = "Testing" },
  { message = "^(\\[[^]]+\\]\\s+)?(chore|ci)", group = "Maintenance" },
  { message = ".*", group = "Other Changes" },
]
filter_commits = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "oldest"
