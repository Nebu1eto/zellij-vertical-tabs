name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  RUSTFLAGS: "-Dwarnings"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4f647fc679bcd3b11499ccb42104547c83dabe96 # stable
        with:
          toolchain: "1.95.0"
          targets: wasm32-wasip1
          components: clippy, rustfmt

      - name: Install Wasmtime
        uses: jcbhmr/setup-wasmtime@960c367a99921eb0b02f5778fce9ae8f110bf0f0 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-features --bin zellij-vertical-tabs -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-features --bin zellij-vertical-tabs

      - name: Build release WASM
        run: cargo build --locked --release --bin zellij-vertical-tabs

      - name: Package plugin views
        run: |
          install -Dm644 target/wasm32-wasip1/release/zellij-vertical-tabs.wasm dist/vertical-tabs.wasm
          install -Dm644 target/wasm32-wasip1/release/zellij-vertical-tabs.wasm dist/vertical-sidebar.wasm

      - name: Upload plugin views
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zellij-vertical-tabs-wasm
          path: |
            dist/vertical-tabs.wasm
            dist/vertical-sidebar.wasm
          if-no-files-found: error
