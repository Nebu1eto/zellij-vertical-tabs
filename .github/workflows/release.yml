name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          fetch-depth: 0

      - name: Verify release tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Tag must use the form vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          package_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          if [[ "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${package_version}" >&2
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4f647fc679bcd3b11499ccb42104547c83dabe96 # stable
        with:
          toolchain: "1.95.0"
          targets: wasm32-wasip1

      - name: Build release WASM
        run: cargo build --locked --release --bin zellij-vertical-tabs

      - name: Package plugin views
        run: |
          install -Dm644 target/wasm32-wasip1/release/zellij-vertical-tabs.wasm dist/vertical-tabs.wasm
          install -Dm644 target/wasm32-wasip1/release/zellij-vertical-tabs.wasm dist/vertical-sidebar.wasm

      - name: Generate changelog
        id: git-cliff
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v3
        with:
          config: cliff.toml
          args: --latest --strip header

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          draft: false
          prerelease: false
          body: ${{ steps.git-cliff.outputs.content }}
          files: |
            target/wasm32-wasip1/release/zellij-vertical-tabs.wasm
            dist/vertical-tabs.wasm
            dist/vertical-sidebar.wasm
