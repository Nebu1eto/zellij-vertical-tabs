[package]
name = "zellij-vertical-tabs"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A unified status and horizontal/vertical tab plugin for Zellij"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_json = "1"
unicode-width = "0.2"
zellij-tile = "0.45.0"

[[bin]]
name = "zellij-vertical-tabs"
path = "src/main.rs"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = true
